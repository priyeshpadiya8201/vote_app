name: Vote Service CI/CD

# Only trigger when vote/ files change
on:
  push:
    paths:
      - 'vote/**'
      - 'k8s-specifications/vote*'
  pull_request:
    paths:
      - 'vote/**'
      - 'k8s-specifications/vote*'

env:
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/vote
  IMAGE_TAG: ${{ github.sha }}

jobs:

  # ─────────────────────────────────────────
  # JOB 1 — Lint Python code
  # ─────────────────────────────────────────
  lint-code:
    name: Lint Python Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8 lint
        run: |
          flake8 vote/ \
            --max-line-length=120 \
            --exclude=vote/.venv,vote/__pycache__

  # ─────────────────────────────────────────
  # JOB 2 — Lint Kubernetes manifests
  # ─────────────────────────────────────────
  lint-manifests:
    name: Lint Kubernetes Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint manifests with yamllint
        run: |
          yamllint -d "{extends: default, rules: {line-length: {max: 150}, truthy: disable}}" \
            k8s-specifications/vote-deployment.yaml \
            k8s-specifications/vote-service.yaml

      - name: Validate Kubernetes Schema with Kubeconform
        uses: yannh/kubeconform-action@v1
        with:
          kubernetes-version: '1.29.0'
          kubernetes-manifests: 'k8s-specifications/'
  # ─────────────────────────────────────────
  # JOB 3 — Build and push Docker image
  # ─────────────────────────────────────────
  build-and-push:
    name: Build and Push Image
    runs-on: ubuntu-latest
    needs: [lint-code, lint-manifests]   # only runs if both lints pass
    outputs:
      image: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./vote
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────
  # JOB 4 — Smoke test on kind cluster
  # ─────────────────────────────────────────
  smoke-test:
    name: Smoke Test on kind
    runs-on: ubuntu-latest
    needs: build-and-push    # only runs if image was pushed successfully

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.22.0/kind-linux-amd64
          chmod +x ./kind && sudo mv ./kind /usr/local/bin/kind

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -Ls https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/

      - name: Create kind cluster
        run: kind create cluster --name vote-test --wait 60s

      - name: Deploy vote service to kind
        run: |
          # Replace image tag in manifest with the freshly built image
          sed -i "s|image: .*vote.*|image: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}|g" \
            k8s-specifications/vote-deployment.yaml

          kubectl apply -f k8s-specifications/vote-deployment.yaml
          kubectl apply -f k8s-specifications/vote-service.yaml

      - name: Wait for pod to be ready
        run: |
          kubectl wait \
            --for=condition=ready pod \
            -l app=vote \
            --timeout=120s

      - name: Run smoke test — check vote returns 200 OK
        run: |
          # Port-forward in background
          kubectl port-forward svc/vote 5000:80 &
          PF_PID=$!
          sleep 5

          # Hit the endpoint and fail if not 200
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000)
          echo "HTTP status: $HTTP_STATUS"

          kill $PF_PID

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "❌ Smoke test FAILED — expected 200, got $HTTP_STATUS"
            exit 1
          fi

          echo "✅ Smoke test PASSED"

      - name: Delete kind cluster
        if: always()    # cleanup even if smoke test fails
        run: kind delete cluster --name vote-test
